name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LumenClient
          path: build/LumenClient.dylib
